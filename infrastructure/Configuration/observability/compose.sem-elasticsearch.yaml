# Stack de observabilidade SEM Elasticsearch:
# métricas (Prometheus/Pushgateway/Alertmanager), traces (Jaeger com storage
# local Badger) e visualização (Grafana). Dimensionado para instâncias de ~4 GB.
#
# Uso:
#   docker compose -f compose.sem-elasticsearch.yaml config --quiet   # valida
#   docker compose -f compose.sem-elasticsearch.yaml up -d
#
# Rede:
#   - Expostos externamente (padrão 0.0.0.0), para a aplicação enviar dados:
#       Pushgateway 9091          (${PUSHGATEWAY_BIND_ADDRESS}) - métricas
#       Jaeger OTLP 4317 e 4318   (${OTLP_BIND_ADDRESS})        - traces
#     Restrinja essas portas no Security Group ao IP da aplicação.
#   - Demais serviços escutam só em ${BIND_ADDRESS} (padrão 127.0.0.1).
#     Acesso via túnel SSH, ex.: ssh -L 3000:127.0.0.1:3000 ubuntu@<host>

name: observability

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-common: &common
  <<: *default-logging
  restart: unless-stopped
  networks:
    - observability

services:
  prometheus:
    <<: *common
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.5.0}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle   # permite reload via POST /-/reload
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  pushgateway:
    <<: *common
    image: prom/pushgateway:${PUSHGATEWAY_TAG:-v1.11.1}
    container_name: pushgateway
    command:
      # Persiste as métricas recebidas para sobreviverem a restarts.
      - --persistence.file=/pushgateway/metrics.db
      - --persistence.interval=1m
    ports:
      - "${PUSHGATEWAY_BIND_ADDRESS:-0.0.0.0}:9091:9091"
    volumes:
      - pushgateway-data:/pushgateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  alertmanager:
    <<: *common
    image: prom/alertmanager:${ALERTMANAGER_TAG:-v0.28.1}
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9093:9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # A imagem do Jaeger roda como uid 10001 e não tem shell; este passo
  # único ajusta o dono do volume do Badger antes do Jaeger subir.
  jaeger-init:
    <<: *default-logging
    image: busybox:${BUSYBOX_TAG:-1.37}
    container_name: jaeger-init
    command: ["chown", "-R", "10001:10001", "/badger"]
    volumes:
      - jaeger-data:/badger
    restart: "no"
    network_mode: none

  jaeger:
    <<: *common
    image: jaegertracing/jaeger:${JAEGER_TAG:-2.10.0}
    container_name: jaeger
    command: ["--config", "/etc/jaeger/config-badger.yaml"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:16686:16686" # UI
      - "${OTLP_BIND_ADDRESS:-0.0.0.0}:4317:4317"   # OTLP gRPC
      - "${OTLP_BIND_ADDRESS:-0.0.0.0}:4318:4318"   # OTLP HTTP
    volumes:
      - ./config/jaeger:/etc/jaeger:ro
      - jaeger-data:/badger
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    <<: *common
    image: grafana/grafana:${GRAFANA_TAG:-12.1.1}
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    secrets:
      - grafana_admin_password
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M

networks:
  observability:
    name: observability
    driver: bridge

volumes:
  prometheus-data:
  pushgateway-data:
  alertmanager-data:
  jaeger-data:
  grafana-data:

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
