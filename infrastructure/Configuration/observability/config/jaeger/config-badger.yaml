# Jaeger v2 (baseado no OpenTelemetry Collector) com storage local Badger.
# Usado pelo compose.sem-elasticsearch.yaml.
# Montado em /etc/jaeger (pasta inteira, read-only).
# Alterações exigem: docker compose -f compose.sem-elasticsearch.yaml restart jaeger

service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    logs:
      level: info
    # Métricas internas do Jaeger, coletadas pelo Prometheus (job "jaeger").
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: badger_main
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      badger_main:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 72h   # traces mais antigos são removidos automaticamente

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_main
