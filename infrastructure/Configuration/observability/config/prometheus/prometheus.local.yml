# Processos locais, sem Docker, AWS ou Pushgateway.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - rules/*.yml
scrape_configs:
  - job_name: ingestion-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8080"]
  - job_name: worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8083"]
  - job_name: mock-legacy
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8081"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
