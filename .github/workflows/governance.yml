name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened]

# O workflow central precisa destas permissões; sem o bloco, o GitHub recusa o job aninhado.
permissions:
  contents: read
  pull-requests: write     # comentário com o veredito
  security-events: write   # SARIF no Code Scanning
  id-token: write          # atestação (Sigstore)
  attestations: write

jobs:
  governance:
    uses: robertosrjr/governance-policies/.github/workflows/governance-required.yml@v1.11.0
    with:
      governance_ref: v1.11.0      # tem que ser igual à tag do 'uses:'
    secrets:                      # só as chaves do projeto (nunca 'secrets: inherit')
      OPENROUTER_API_KEY: ${{ secrets.VIRTUALTHREADS_OR_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.VIRTUALTHREADS_JEV_API_KEY }}
