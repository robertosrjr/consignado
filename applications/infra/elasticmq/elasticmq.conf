# ElasticMQ (API compativel com SQS) - filas da PoC.
# Limitacao: o ElasticMQ nao aplica retencao de 14 dias da DLQ; isso e requisito do Terraform (U6).
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  sqs-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
  sqs-fast-lane-queue {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 5 seconds
    deadLettersQueue {
      name = "sqs-dlq"
      maxReceiveCount = 3
    }
  }
  sqs-standard-lane-queue {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 5 seconds
    deadLettersQueue {
      name = "sqs-dlq"
      maxReceiveCount = 3
    }
  }
}
