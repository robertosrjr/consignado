apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
  # CloudWatch: SQS (profundidade, idade da mais antiga, DLQ), Lambda, DynamoDB e o namespace
  # ConsignadoPoc/Dispatcher (EMF). Credenciais pela role do EC2 (cadeia padrao); sem chaves no arquivo.
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: sa-east-1
    editable: false
